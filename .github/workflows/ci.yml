name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # tmux is only needed by the parts that talk to a real session; the
        # suite is pure logic today, but installing it keeps that door open.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          cargo test
