name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: cargo build --release --locked

      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "the tag says $tag and Cargo.toml says $crate"
            exit 1
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/rcmd
            packaging/rcmd.service
          generate_release_notes: true
