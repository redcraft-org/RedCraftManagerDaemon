[package]
name = "rcmd"
version = "0.1.0"
edition = "2021"
description = "RedCraftManagerDaemon: one service that builds, ships and runs a Minecraft server fleet"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_matches = "1"
